<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suffix Search</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            margin: 0 0 40px 0;
            text-align: center;
            line-height: 1;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea, input {
            width: 100%;
            padding: 16px;
            background: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            border-radius: 0;
            transition: all 0.2s;
        }

        textarea:focus, input:focus {
            outline: none;
            background: #222222;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        button {
            width: 100%;
            padding: 20px;
            background: #ffffff;
            color: #000000;
            border: none;
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #e0e0e0;
        }
        
        button:active {
            transform: scale(0.98);
        }

        #output {
            margin-top: 16px;
            padding: 20px;
            background: #000000;
            border: 1px dashed #ffffff;
            min-height: 80px;
            white-space: pre-wrap;
            font-size: 16px;
            font-family: monospace;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1 class="hero-title">Suffix Search</h1>
    
    <div class="container">
        <div class="input-group">
            <label for="text">Text to Index</label>
            <textarea id="text" placeholder="Enter text here..."></textarea>
        </div>
        
        <div class="input-group">
            <label for="pattern">Search Pattern</label>
            <input type="text" id="pattern" placeholder="Enter pattern to search...">
        </div>
        
        <button onclick="performSearch()">Execute Search</button>
        
        <div id="output">System ready. Awaiting input...</div>
    </div>

    <script>
        async function performSearch() {
            const text = document.getElementById('text').value;
            const pattern = document.getElementById('pattern').value;
            const output = document.getElementById('output');

            if (!text || !pattern) {
                output.innerText = 'ERROR: Text and Pattern required.';
                return;
            }

            output.innerText = 'PROCESSING...';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, pattern })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.count === 0) {
                        output.innerHTML = `STATUS: NOT FOUND\nTIME: ${data.time}`;
                    } else {
                        output.innerHTML = `STATUS: MATCH FOUND\nCOUNT: ${data.count}\nPOSITIONS: [${data.positions.join(', ')}]\nTIME: ${data.time}`;
                    }
                } else {
                    output.innerText = `ERROR: ${data.error}`;
                }
            } catch (err) {
                output.innerText = `FATAL ERROR: ${err.message}`;
            }
        }
    </script>
</body>
</html>
